name: Test HUGO_EXTENDED flag with missing TARGET_REPO
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with HUGO_EXTENDED=true but no TARGET_REPO
        id: action
        uses: .
        env:
          HUGO_EXTENDED: "true"
          HUGO_VERSION: "0.111.3"
          TARGET_REPO: ""
        continue-on-error: true

      - name: Assert action failed due to missing TARGET_REPO
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when TARGET_REPO is not set"
            exit 1
          fi
          echo "PASS: action correctly failed when TARGET_REPO is missing (HUGO_EXTENDED=true)"
