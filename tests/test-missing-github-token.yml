name: Test missing GITHUB_TOKEN fails with clear error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires GITHUB_TOKEN (or TOKEN). When neither is set,
      # it should exit 1 with a descriptive message.
      - id: action
        uses: .
        continue-on-error: true
        env:
          # Intentionally omit GITHUB_TOKEN / TOKEN
          TARGET_REPO: some-org/some-repo

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when GITHUB_TOKEN is missing"
            exit 1
          fi
          echo "PASS: action correctly failed when GITHUB_TOKEN was missing"
