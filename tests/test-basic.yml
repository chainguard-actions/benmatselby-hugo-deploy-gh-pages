name: Test basic hugo deploy (expected failure at build)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action downloads Hugo, then tries to build the site.
      # Without a real Hugo site in the workspace it will fail at the build step.
      # We capture that expected failure and assert on the exit code.
      - id: action
        uses: .
        with:
          github_token: fake-token-for-testing
          hugo_version: "0.111.3"
          target_repo: fake-org/fake-repo
        continue-on-error: true

      - name: Assert action failed at hugo build (no site present)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no Hugo site is present, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no Hugo site was present"
