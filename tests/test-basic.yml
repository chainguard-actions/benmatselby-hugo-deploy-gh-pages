name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          hugo_version: "0.120.0"
          target_repo: example/example-site
      - name: Assert action ran
        run: |
          echo "Action completed (may have failed due to fake credentials, which is expected)"
          echo "PASS: action was invoked with required inputs"
