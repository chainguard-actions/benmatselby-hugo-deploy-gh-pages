name: Test cname input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Hugo site structure in workspace
        run: |
          printf 'baseURL = "https://example.com/"\nlanguageCode = "en-us"\ntitle = "Test CNAME Site"\n' > "$GITHUB_WORKSPACE/hugo.toml"
          mkdir -p "$GITHUB_WORKSPACE/content"
          printf -- '---\ntitle: "Home"\n---\nHello World CNAME\n' > "$GITHUB_WORKSPACE/content/_index.md"

      - name: Run Hugo deploy action with cname input
        id: action
        uses: .
        with:
          hugo_version: "0.111.3"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          target_repo: "this-repo-does-not-exist-xyz123/nonexistent"
          target_branch: "test-output"
          cname: "www.example.com"
        continue-on-error: true

      - name: Assert action ran with cname input
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail at git push (nonexistent repo), not at Hugo
          # install or build. This validates the cname input is accepted.
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "WARN: expected failure at git push but got success - also acceptable"
          fi
          echo "PASS: action ran with cname=www.example.com"
