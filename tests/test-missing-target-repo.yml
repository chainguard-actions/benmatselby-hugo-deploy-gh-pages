name: Test missing TARGET_REPO validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without TARGET_REPO
        id: action
        uses: .
        continue-on-error: true
        env:
          TARGET_REPO: ""

      - name: Assert action failed due to missing TARGET_REPO
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when TARGET_REPO is not set"
            exit 1
          fi
          echo "PASS: action correctly failed when TARGET_REPO is missing"
