name: Test missing target_repo error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without target_repo and expect failure
        id: action
        uses: .
        with:
          hugo_version: "0.111.3"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          target_repo: ""
        continue-on-error: true

      - name: Assert action failed due to missing target_repo
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when target_repo is missing"
            exit 1
          fi
          echo "PASS: action correctly failed when target_repo is missing"
