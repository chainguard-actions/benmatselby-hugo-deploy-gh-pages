name: Test missing GITHUB_TOKEN validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without GITHUB_TOKEN and expect failure
        id: action
        uses: .
        env:
          GITHUB_TOKEN: ""
          TARGET_REPO: "some-org/some-repo"
        continue-on-error: true

      - name: Assert action failed due to missing GITHUB_TOKEN
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when GITHUB_TOKEN is not set"
            exit 1
          fi
          echo "PASS: action correctly failed when GITHUB_TOKEN is missing"
