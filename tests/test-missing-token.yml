name: Test missing github_token error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without github_token and expect failure
        id: action
        uses: .
        with:
          hugo_version: "0.111.3"
          target_repo: "someuser/somerepo"
          github_token: ""
        continue-on-error: true

      - name: Assert action failed due to missing token
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when github_token is missing"
            exit 1
          fi
          echo "PASS: action correctly failed when github_token is missing"
