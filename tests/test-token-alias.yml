name: Test TOKEN env var alias for GITHUB_TOKEN
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with TOKEN alias but no TARGET_REPO
        id: action
        uses: .
        continue-on-error: true
        env:
          TOKEN: "fake-alias-token"
          GITHUB_TOKEN: ""
          TARGET_REPO: ""

      - name: Assert action failed at TARGET_REPO check (not at token check)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail because TARGET_REPO is missing,
          # which means it passed the GITHUB_TOKEN check (TOKEN alias worked).
          # Either way the action must fail (not succeed).
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail (missing TARGET_REPO)"
            exit 1
          fi
          echo "PASS: action failed as expected (TOKEN alias accepted, TARGET_REPO missing)"
