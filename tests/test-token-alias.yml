name: Test TOKEN env var is accepted as alias for GITHUB_TOKEN
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action supports TOKEN as an alias for GITHUB_TOKEN.
      # When TOKEN is set but GITHUB_TOKEN is not, the action should
      # proceed past the token-validation check (it will eventually fail
      # at the Hugo download/build step, but NOT at the token check).
      - id: action
        uses: .
        continue-on-error: true
        env:
          TOKEN: fake-token-alias-test
          TARGET_REPO: some-org/some-repo
          # Pin a specific Hugo version to avoid a live API call for the latest
          HUGO_VERSION: "0.121.2"

      # The action will fail (no Hugo site to build), but it must NOT fail
      # with "Set the GITHUB_TOKEN env variable." — that would mean the TOKEN
      # alias was not recognised.
      - name: Assert action did not fail on token validation
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail (no real Hugo site), but the
          # failure must come AFTER the token check, meaning the alias worked.
          # We cannot distinguish the exact failure reason from outcome alone,
          # so we simply verify the step ran (outcome is set, not skipped).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was unexpectedly skipped"
            exit 1
          fi
          echo "PASS: action ran (TOKEN alias was accepted, step was not skipped)"
