name: Test TOKEN env var is accepted as alias for GITHUB_TOKEN
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with TOKEN set but no TARGET_REPO
        id: action
        uses: .
        env:
          TOKEN: "${{ github.token }}"
          TARGET_REPO: ""
        continue-on-error: true

      - name: Assert action failed on TARGET_REPO check (not token check)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail because TARGET_REPO is missing.
          # If TOKEN alias is recognized, the token check passes and we reach TARGET_REPO check.
          # Either way the action must fail here.
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when TARGET_REPO is not set"
            exit 1
          fi
          echo "PASS: action correctly failed (TOKEN alias accepted, TARGET_REPO check triggered)"
